name: Standalone checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy safetensors jsonschema
      - run: python -m unittest discover -s examples -v
      - run: python examples/continuous_basis_check.py
      - run: python examples/demo_free_diffusion.py
